# Generated by tools/sync_edge.py from ais_catcher/. Do not edit by hand:
# change the stable add-on and run the script.
name: AIS-catcher Receiver (Edge)
version: "0.1.4-edge"
slug: ais_catcher_edge
description: The Receiver add-on built against the rolling Edge build, for managed mode
url: https://github.com/nanamitm/AIS-catcher-HA/tree/main/ais_catcher_edge
arch:
  - aarch64
  - amd64
init: false
startup: services

# The SDR is a USB device on the host: `usb` maps /dev/bus/usb into the add-on
# and `udev` gives AIS-catcher the device metadata it needs to tell dongles
# apart.  `uart` is for the serial receivers (dAISy and friends).
# `full_access` would also work and is deliberately not used -- it turns off
# protection mode for the whole add-on and is not needed for libusb.
usb: true
udev: true
uart: true

ingress: true
ingress_stream: true
panel_icon: mdi:access-point
panel_title: AIS Edge

# The web viewer, which is what the Statistics add-on polls and what the rest of
# the network connects to.  The container side is fixed (see run.sh); the host
# side can be changed in the add-on's Network panel.
ports:
  8100/tcp: 8100
  8118/tcp: 8118
  8119/tcp: 8119
ports_description:
  8100/tcp: >-
    AIS-catcher web viewer in manual mode. The Statistics add-on reads
    api/stat.json here.
  8118/tcp: >-
    The dashboard in managed mode, which asks for a password of its own. It
    can also be selected for the sidebar; nothing listens here in manual mode.
  8119/tcp: >-
    The web viewer managed mode brings up beside the dashboard. Nothing
    listens here in manual mode, which uses 8100.

options:
  mode: managed
  managed_sidebar: web_viewer
  log_level: info
  udp_targets: []
schema:
  mode: list(managed|manual)
  managed_sidebar: list(web_viewer|dashboard)
  log_level: list(debug|info|warning|error)
  # Everything below is read in manual mode only -- in managed mode the station
  # is configured from the dashboard and stored in /data/config.json.
  device_index: int(0,16)?
  device_serial: str?
  sample_rate: str?
  tuner_gain: str?
  rtlagc: bool?
  biastee: bool?
  freq_correction: int(-150,150)?
  station_name: str?
  latitude: float?
  longitude: float?
  share_location: bool?
  web_plugins: bool?
  share_community: bool?
  sharing_key: password?
  udp_targets:
    - host: str
      port: port
  extra_args: str?
