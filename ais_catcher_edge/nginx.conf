# Puts the AIS-catcher UI in the Home Assistant sidebar.
#
# Unlike the Statistics add-on, the upstream here is inside this very container,
# so there is no name to re-resolve and no upstream credentials: run.sh writes a
# single proxy_pass line to upstream.conf, pointing at the web viewer of
# whichever mode is running.
#
# run.sh selects the web viewer or, in managed mode when requested, the control
# dashboard. The viewer already uses relative URLs. The dashboard does not, so
# run.sh also adds response substitutions that keep its /api and /viewer calls
# inside Home Assistant's ingress path.

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # AIS-catcher's managed dashboard always compresses its responses, even
    # when Accept-Encoding asks for identity. Keep decompression in a separate
    # proxy stage so the ingress-facing server can run sub_filter on plain text.
    server {
        listen 127.0.0.1:8098;

        location / {
            proxy_pass http://127.0.0.1:8118;
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
            gunzip on;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        # The ingress default, so config.yaml does not name a port at all.
        listen 8099;

        # Ingress reaches the add-on from the Supervisor and nothing else.
        allow 172.30.32.2;
        deny all;

        location / {
            include /etc/nginx/upstream.conf;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Both the dashboard and the map push updates over server-sent
            # events, so nothing may be buffered and the connection has to stay
            # open.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
