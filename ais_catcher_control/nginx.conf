# AIS-catcher-control assumes that it is mounted at /. Home Assistant ingress
# mounts it below a tokenised path. The first server decompresses upstream
# responses; the ingress-facing server then changes root-relative links into
# relative ones and scopes the control session cookie to this ingress panel.

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;

    map $http_x_ingress_path $control_cookie_path {
        ""      /;
        default $http_x_ingress_path;
    }

    server {
        listen 127.0.0.1:8098;

        location / {
            include /etc/nginx/upstream.conf;

            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 8099;

        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:8098;
            proxy_http_version 1.1;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Go's http.Redirect emits root-relative Location headers.
            proxy_redirect ~^/(.*)$ ./$1;

            # AIS-catcher-control calls its cookie session_id. Keeping it below
            # the ingress path avoids collisions with another control panel.
            proxy_cookie_path / $control_cookie_path;

            # The application currently has no base-path option. Relative URLs
            # resolve below the ingress token and are stripped by Supervisor on
            # their way back to this proxy.
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript;
            sub_filter 'href="/' 'href="';
            sub_filter "href='/" "href='";
            sub_filter 'src="/' 'src="';
            sub_filter "src='/" "src='";
            sub_filter 'action="/' 'action="';
            sub_filter "action='/" "action='";
            sub_filter 'url(/' 'url(';
            sub_filter "fetch('/" "fetch('";
            sub_filter 'fetch("/' 'fetch("';
            sub_filter 'fetch(`/' 'fetch(`';
            sub_filter "'/api/" "'api/";
            sub_filter '"/api/' '"api/';
            sub_filter '`/api/' '`api/';
            sub_filter "'/logs-stream" "'logs-stream";
            sub_filter '"/logs-stream' '"logs-stream';
            sub_filter "EventSource('/" "EventSource('";
            sub_filter 'EventSource("/' 'EventSource("';
            sub_filter "'/system-action-" "'system-action-";
            sub_filter '"/system-action-' '"system-action-';
            sub_filter "window.location.href='/" "window.location.href='";
            sub_filter 'window.location.href="/' 'window.location.href="';
        }
    }
}
