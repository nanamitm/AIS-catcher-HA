name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bridge:
    name: Bridge unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run the bridge test
        run: python tests/test_bridge.py

  run-args:
    name: Receiver command line test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the command line test
        run: |
          bash tests/test_run_args.sh
          bash tests/test_stats_sidebar.sh
          bash tests/test_control_sidebar.sh
