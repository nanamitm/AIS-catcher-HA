name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  addon:
    name: Add-on linter (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [ais_catcher, ais_catcher_edge, ais_catcher_stats]
    steps:
      - uses: actions/checkout@v4
      - name: Check the add-on manifest
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check run.sh
        # SC1008: the bashio shebang is not a shell shellcheck knows about.
        # SC2155: "export X=$(...)" is the normal bashio idiom.
        run: |
          shellcheck --shell=bash --exclude=SC1008,SC2155 \
            ais_catcher/run.sh \
            ais_catcher_edge/run.sh \
            ais_catcher_stats/run.sh

  edge:
    name: Edge add-on is generated, not edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ais_catcher_edge/ against tools/sync_edge.py
        run: python tools/sync_edge.py --check

  nginx:
    name: Ingress proxy config (${{ matrix.addon }})
    runs-on: ubuntu-latest
    container: nginx:alpine
    strategy:
      fail-fast: false
      matrix:
        addon: [ais_catcher, ais_catcher_edge, ais_catcher_stats]
    steps:
      - uses: actions/checkout@v4
      - name: Check nginx.conf
        # upstream.conf is generated from the add-on options at start; a stand-in
        # is enough to prove the surrounding configuration parses.
        run: |
          cp ${{ matrix.addon }}/nginx.conf /etc/nginx/nginx.conf
          echo 'proxy_pass http://127.0.0.1:8100;' > /etc/nginx/upstream.conf
          mkdir -p /tmp/nginx_client_body /tmp/nginx_proxy
          nginx -t
