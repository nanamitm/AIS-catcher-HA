name: AIS-catcher Statistics
version: "0.2.0"
slug: ais_catcher_stats
description: AIS-catcher statistics and vessel trackers in Home Assistant, via MQTT discovery
url: https://github.com/nanamitm/AIS-catcher-HA/tree/main/ais_catcher_stats
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:need
options:
  url: "http://192.168.1.10:8100"
  scan_interval: 30
  device_name: "AIS-catcher"
  device_id: "aiscatcher"
  message_type_sensors: true
  remove_entities_on_stop: false
  log_level: info
  vessels: []
  vessel_timeout: 30
schema:
  url: url
  scan_interval: int(5,3600)
  device_name: str
  device_id: match(^[a-z0-9_]+$)
  message_type_sensors: bool
  remove_entities_on_stop: bool
  log_level: list(debug|info|warning|error)
  vessels:
    - mmsi: int(1,999999999)
      name: str?
  vessel_timeout: int(1,1440)
  http_username: str?
  http_password: password?
  verify_ssl: bool?
  discovery_prefix: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
