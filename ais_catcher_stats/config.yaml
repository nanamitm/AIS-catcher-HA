name: AIS-catcher Statistics
version: "0.5.0"
slug: ais_catcher_stats
description: AIS-catcher statistics and vessel trackers in Home Assistant, via MQTT discovery
url: https://github.com/nanamitm/AIS-catcher-HA/tree/main/ais_catcher_stats
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:radar
panel_title: AIS-catcher
services:
  # want, not need: an external broker can be configured through the
  # mqtt_host option, and `need` would refuse to start without a
  # Supervisor-provided one.
  - mqtt:want
options:
  url: "http://192.168.1.10:8100"
  sidebar_view: web_viewer
  scan_interval: 30
  device_name: "AIS-catcher"
  device_id: "aiscatcher"
  message_type_sensors: true
  remove_entities_on_stop: false
  log_level: info
  vessels: []
  vessel_timeout: 30
  fleet_sensors: true
  nearby_radius: 5
schema:
  url: url
  sidebar_view: list(web_viewer|dashboard)
  dashboard_url: url?
  scan_interval: int(5,3600)
  device_name: str
  device_id: match(^[a-z0-9_]+$)
  message_type_sensors: bool
  remove_entities_on_stop: bool
  log_level: list(debug|info|warning|error)
  vessels:
    - mmsi: int(1,999999999)
      name: str?
  vessel_timeout: int(1,1440)
  fleet_sensors: bool
  nearby_radius: int(1,500)
  http_username: str?
  http_password: password?
  verify_ssl: bool?
  discovery_prefix: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
