# Puts the AIS-catcher web UI in the Home Assistant sidebar.
#
# AIS-catcher runs elsewhere on the network, so ingress needs something inside
# the add-on to talk to: this proxies the whole UI through, which also means the
# browser never has to reach the receiver itself.  It works unchanged under the
# ingress path prefix because every asset and API call in the AIS-catcher UI is
# relative (`script.js`, `api/ships_array.json`, ...).
#
# The upstream, and any credentials for it, are written to upstream.conf by
# run.sh from the add-on options.

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # The ingress default, so config.yaml does not name a port at all.
        listen 8099;

        # Ingress reaches the add-on from the Supervisor and nothing else.
        allow 172.30.32.2;
        deny all;

        location / {
            include /etc/nginx/upstream.conf;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # The map pushes updates over server-sent events (api/signal), so
            # nothing may be buffered and the connection has to stay open.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
